services:
  postgres_test:
    image: postgres:16-alpine
    container_name: clinic-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic_test_user
      POSTGRES_PASSWORD: clinic_test_password
      POSTGRES_DB: clinic_test_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_test_user -d clinic_test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
